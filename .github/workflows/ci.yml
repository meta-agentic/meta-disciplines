name: ci

# Quoted: bare `on` is a YAML 1.1 boolean.
"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalogue:
    name: Catalogue and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Manifests agree with pack.yaml
        run: |
          python -m pip install --disable-pip-version-check --quiet "pyyaml==6.0.2"
          python scripts/sync_manifests.py --check

      - name: No wikilinks; every relative link resolves
        run: python scripts/check_links.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: claude plugin validate (catalogue and every plugin)
        run: |
          set -euo pipefail
          npm install --global --silent @anthropic-ai/claude-code
          claude plugin validate --strict .
          for p in plugins/*/; do claude plugin validate --strict "$p"; done

  conformance:
    name: Pack conformance
    strategy:
      fail-fast: false
      matrix:
        pack: [agents, agile, math, physics, swe]
    uses: meta-agentic/meta-os/.github/workflows/pack-conformance.yml@main
    with:
      pack-path: plugins/meta-discipline-${{ matrix.pack }}
