# Pack manifest — declares the config schema and profiles the agile pack understands.
# Read by scripts/packs.sh config for resolution/validation; humans read the README.
name: agile
default_profile: scrum
profiles: [scrum, kanban]
config:
  profile:     { default: scrum, one_of: [scrum|kanban] }
  tracker:     { default: local, one_of: [jira|local|none] }
  space:       { note: "backlog space name — resolves <space> in the skills" }
  mirror-repo: { note: "<owner>/<repo> holding the backlog mirror; required when tracker=jira" }
  estimation-scale: { default: fibonacci, one_of: [fibonacci|t-shirt|linear] }
  estimation-consensus: { default: median, one_of: [median|strict], note: "team estimation: median per axis, or require a unanimous quadrant" }
  estimation-repoint-threshold: { default: 1.0, note: "per-axis range above which a repoint is called; axis span is 2.0" }
