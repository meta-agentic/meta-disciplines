# Copy this block into your instance's .packs.yaml under packs: software-engineering: config:
#
# Mounting this pack enables NOTHING. With no config block at all, constrained-generation
# declines and hands back to ordinary design work. That is the intended default — leave it
# there until you have a recurring generation problem a validator can check.
packs:
  software-engineering:
    config:
      dsl_generation: "off"   # off | advisory | on   ← nothing runs until this moves

# Step 1 — `advisory` first. The skill runs its four-condition gate on a candidate and
# reports the verdict, but authors no grammar, parser, or validator. Most estates stop here.
#
# packs:
#   software-engineering:
#     config:
#       dsl_generation: advisory
#
# Step 2 — `on` once a candidate has passed the gate AND you can name a real validator.
# Without validator_command the repair loop cannot close, and the skill will say so rather
# than pretend to check its own output.
#
# packs:
#   software-engineering:
#     config:
#       dsl_generation: on
#       dsl_style: internal              # internal | external
#       host_language: typescript        # whose compiler enforces an internal DSL
#       validator_command: npm run typecheck
#       max_repair_iterations: 3
