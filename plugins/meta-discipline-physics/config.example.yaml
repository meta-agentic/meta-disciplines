# Copy this block into your instance's .packs.yaml under packs: meta-discipline-physics: config:
# Also add the `meta-discipline-math` pack — physics reuses its dimensional-analysis skill.
packs:
  meta-discipline-math: {}
  meta-discipline-physics:
    config:
      profile: applied      # pure | applied
      units: SI             # SI | gaussian | natural
      notation: latex       # latex | unicode | ascii
      cas: sympy            # sympy | sage | none
      sig_figs: 3
